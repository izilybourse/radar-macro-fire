# Workflow 1 : snapshot du régime, de la bulle et de l'allocation.
# Toutes les 30 min pendant les heures de marché US (lun à ven, 13h à 21h UTC couvre l'heure d'été et d'hiver)
# + une exécution de clôture à 22h15 UTC : c'est elle seule qui fait avancer le compteur d'inertie.
name: Radar snapshot
on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "intraday (sans avancer l'inertie) ou close (avance l'inertie d'un jour)"
        type: choice
        default: intraday
        options: [intraday, close]

permissions:
  contents: write

# Un seul workflow à la fois écrit sur la branche data
concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Préparer la branche data
        run: bash scripts/prepare_data_branch.sh
      - name: Calcul du snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '15 22 * * 1-5' && 'close' || 'intraday') }}
        run: python scripts/radar.py snapshot --mode "$MODE" --out data-out
      - name: Publier sur la branche data (GitHub Pages)
        run: bash scripts/publish_data_branch.sh
      - name: Déploiement FTP Hostinger (optionnel, actif si le secret FTP_SERVER existe)
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./data-out/
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
