# Workflow 2 : CAPE de Shiller, une fois par mois (le fichier source est lui même mensuel).
name: Radar CAPE mensuel
on:
  schedule:
    - cron: "20 6 3,18 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  cape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Préparer la branche data
        run: bash scripts/prepare_data_branch.sh
      - name: Calcul du CAPE
        env:
          CAPE_XLS_URL: ${{ vars.CAPE_XLS_URL }}
        run: python scripts/radar.py cape --out data-out
      - name: Publier
        run: bash scripts/publish_data_branch.sh
      - name: Déploiement FTP Hostinger (optionnel)
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./data-out/
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
